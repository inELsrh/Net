<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux 伺服器與網路管理線上測驗</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .nav-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }
        .nav-tab {
            padding: 10px 20px;
            cursor: pointer;
            background: #e0e0e0;
            border: none;
            font-size: 16px;
            font-weight: bold;
            outline: none;
            transition: 0.3px;
        }
        .nav-tab.active {
            background: #3498db;
            color: white;
            border-bottom: 2px solid #2980b9;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .question {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #fafafa;
        }
        .question.incorrect {
            border-color: #e74c3c;
            background: #fdf2f2;
        }
        .question.correct {
            border-color: #2ecc71;
            background: #f2f9f4;
        }
        .question-title {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .options label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }
        .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
        }
        .feedback.correct-msg {
            background: #d4edda;
            color: #155724;
        }
        .feedback.incorrect-msg {
            background: #f8d7da;
            color: #721c24;
        }
        .explanation {
            margin-top: 5px;
            font-size: 13px;
            color: #555;
            background: #fff3cd;
            padding: 8px;
            border-radius: 4px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            margin-top: 20px;
        }
        .btn:hover {
            background: #2980b9;
        }
        #score-panel {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        table.history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table.history-table th, table.history-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        table.history-table th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Linux 伺服器與網路管理測驗</h1>
    
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('quiz')">開始測驗</button>
        <button class="nav-tab" onclick="switchTab('history')">歷史紀錄</button>
    </div>

    <!-- 測驗區域 -->
    <div id="quiz-section" class="section active">
        <div id="score-panel" style="display:none;"></div>
        <form id="quiz-form"></form>
        <button type="button" class="btn" id="submit-btn" onclick="submitQuiz()">交卷看成績與錯題</button>
    </div>

    <!-- 歷史紀錄區域 -->
    <div id="history-section" class="section">
        <h2>測驗歷史紀錄</h2>
        <div id="history-content"></div>
        <button type="button" class="btn" style="background: #e74c3c;" onclick="clearHistory()">清除歷史紀錄</button>
    </div>
</div>

<script>
// 完整 100 題原始資料
const quizData = [
    { id: 1, type: "multiple", q: "關於Telnet伺服器的敘述，下列哪些錯誤？", options: ["A. 預設會限制root不能登入系統", "B. 在/etc/nologin檔案中可設定不可登入的使用者清單", "C. 在預設的狀況下，只要開啟Telnet服務，所有使用者都能登入系統", "D. 若在設定/etc/nologin檔案時已有使用者登入系統，則使用者會被立刻強迫登出"], ans: ["B", "C", "D"], exp: "" },
    { id: 2, type: "single", q: "Sendmail Server啟動時，下列哪一項是使用到的主要設定檔？", options: ["A. /etc/mail/access", "B. /etc/mail/submit.cf", "C. /etc/mail/sendmail.cf", "D. /etc/mail/sendmail.mc"], ans: ["C"], exp: "Sendmail Server在啟動時使用的主要設定檔是sendmail.cf。" },
    { id: 3, type: "single", q: "下列哪一項協定是TCP/IP中用來將IP位址解析成MAC位址？", options: ["A. TCP", "B. UDP", "C. ARP", "D. ICMP"], ans: ["C"], exp: "" },
    { id: 4, type: "single", q: "若要在Sendmail中設定郵件轉發（Forwarding），應該在下列哪一個檔案進行設定？", options: ["A. /etc/mail/access", "B. /etc/mail/sendmail.cf", "C. /etc/aliases", "D. /var/spool/mail"], ans: ["C"], exp: "使用/etc/aliases檔案，您可以定義郵件地址的別名或將某個地址的郵件重新定向到其他地址或多個地址。" },
    { id: 5, type: "multiple", q: "關於Sendmail以standalone模式運作的相關設定，下列哪些正確？", options: ["A. 必須在/etc/inetd.conf或/etc/xinetd.conf中設定Sendmail", "B. 使用/etc/hosts.allow和/etc/hosts.deny可以限制SMTP的連線範圍", "C. SMTP通常在port 25傾聽等待連線", "D. 使用ipchains或iptables可以限制SMTP的連線範圍"], ans: ["B", "C"], exp: "" },
    { id: 6, type: "single", q: "當您想從域名查找其相應的IP地址時，屬於下列哪一項操作？", options: ["A. 反解查詢", "B. 領域查詢", "C. 權威查詢", "D. 正解查詢"], ans: ["D"], exp: "" },
    { id: 7, type: "single", q: "關於Sendmail的敘述，下列哪一項錯誤？", options: ["A. 預設安裝的Sendmail，只有本機可以寄信", "B. 當系統安裝完成，Sendmail套件就安裝完成並已啟動Sendmail服務", "C. 安裝好的Sendmail，啟動的port埠號為110", "D. 預設安裝的Sendmail，可以提供系統寄信給root管理者"], ans: ["C"], exp: "Sendmail預設使用的SMTP埠號為25，不是110。" },
    { id: 8, type: "single", q: "小明現在正在替公司的Ubuntu Linux進行SELinux安全模組設定。他希望公司的網站網頁可以直接連結至資料庫，請問他應該要開放下列哪一個布林值？", options: ["A. httpd_can_network_connect", "B. httpd_can_connect_to_mysql", "C. httpd_can_network_connect_db", "D. httpd_can_connect_database"], ans: ["C"], exp: "" },
    { id: 9, type: "single", q: "下列哪一項是Squid服務的預設連線埠號？", options: ["A. 3128", "B. 443", "C. 8080", "D. 80"], ans: ["A"], exp: "Squid服務啟動後，預設會開啟3128連線埠號。" },
    { id: 10, type: "single", q: "Samba分享資源，分享設定檔中hosts allow = 要使用網域名稱，必須在global section開啟主機名稱查詢，下列哪一項設定開啟此項查詢？", options: ["A. domainname lookups = yes", "B. dns allow = yes", "C. dns search = yes", "D. hostname lookups = yes"], ans: ["D"], exp: "" },
    { id: 11, type: "single", q: "Samba伺服器tqc8分享資源common，請問下列哪一項指令可以使用帳號lin密碼123登入？", options: ["A. smbclient //tqc8/common -P lin%123", "B. smbclient //tqc8/common -U lin -P 123", "C. smbclient //tqc8/common -U lin:123", "D. smbclient //tqc8/common -U lin%123"], ans: ["D"], exp: "" },
    { id: 12, type: "single", q: "小花想要連結公司Ubuntu Linux Server上的LDAP服務，並且進行帳號資料的查詢，請問她可以執行下列哪一個指令？", options: ["A. ldapsearch", "B. ldapadmin", "C. ldapquery", "D. ldaplink"], ans: ["A"], exp: "" },
    { id: 13, type: "single", q: "我們常用的瀏覽器，例如firefox，是屬於OSI模型中的哪一層？", options: ["A. 網路層（Network Layer）", "B. 表現層（Presentation Layer）", "C. 應用層（Application Layer）", "D. 會議層（Session Layer）"], ans: ["C"], exp: "" },
    { id: 14, type: "single", q: "如附圖所示，為某台名稱伺服器的/etc/bind/named.conf檔案部分內容，請問下列敘述哪一項錯誤？", options: ["A. 對於DNS區域example.com而言，主要名稱伺服器的IP位址是192.168.254.2", "B. 該台名稱伺服器會將區域example.com的正解區域檔案儲存在/etc/bind/", "C. 該台名稱伺服器會將區域example.com的正解區域檔案儲存在/var/cache/bind", "D. 對於DNS區域example.com而言，該台名稱伺服器是次要名稱伺服器"], ans: ["B"], exp: "當設定檔案裡出現相對路徑時，會和directory所指定的/var/cache/bind結合以形成絕對路徑。" },
    { id: 15, type: "single", q: "如附圖所示，已知目前Ubuntu主機是採取預設的netplan統一管理網路設定，小明想要檢查目前實驗室Ubuntu主機預設路由的設定狀況，於是他查看/etc/netplan/03-demo03-config.yaml網卡組態設定檔，該檔案內容如附圖，請問下列敘述哪一項正確？", options: ["A. 目前預設路由設定為10.0.3.254以及10.0.5.254，其中10.0.5.254的metric為200、優先權較高，故10.0.5.254", "B. 目前預設路由設定為10.0.3.254以及10.0.5.254；其實這是設定上的錯誤，套用時會產生錯誤訊息，必須修正", "C. 目前預設路由設定為10.0.3.254以及10.0.5.254。未匹配任何路由規則的封包將會輪流由10.0.3.254與", "D. 目前預設路由設定為10.0.3.254以及10.0.5.254，其中10.0.3.254的metric為100、優先權較高，故10.0.3.254"], ans: ["D"], exp: "" },
    { id: 16, type: "single", q: "設定郵件伺服器的別名，如果要從檔案/var/mail/pilot.aliases讀入用戶的別名列表，應在/etc/aliases檔案中進行下列哪一種記述？", options: ["A. csf: /var/mail/pilot.aliases", "B. csf: DX/var/mail/pilot.aliases", "C. csf: :include:/var/mail/pilot.aliases", "D. csf: CF/var/mail/pilot.aliases"], ans: ["C"], exp: "在/etc/aliases檔案中，使用\":include:\"指示符可以將指定的檔案中的內容作為別名列表引入。" },
    { id: 17, type: "single", q: "如果Apache想要啟用加密傳輸協定https，請問下列哪一項是必須啟用的模組？", options: ["A. encryption", "B. ssl", "C. https", "D. tls"], ans: ["B"], exp: "(A)(C)(D)皆不存在此模組名稱。" },
    { id: 18, type: "single", q: "如附圖所示，是Nginx設定檔案的一部分，當有網頁瀏覽器要透過該Nginx讀取某目錄底下的資源時，需要輸入帳號和密碼。Nginx會檢查一Apache所採用的格式之密碼檔內容，確定該輸入帳號及密碼是否正確。關於指定該密碼檔案位置的設定敘述，下列敘述哪一項正確？", options: ["A. auth_basic_file", "B. auth_basic_passwd_file", "C. auth_basic_user_file", "D. auth_file"], ans: ["C"], exp: "" },
    { id: 19, type: "single", q: "如附圖所示，下列哪一項數值用來讓次要名稱伺服器知道每隔多久的時間，必須向主要名稱伺服器檢查正/反解區域檔是否有更新？", options: ["A. 3w", "B. 12h", "C. 2h", "D. 15m"], ans: ["B"], exp: "" },
    { id: 20, type: "single", q: "小花開發好的程式連線埠為TCP 80埠，如果想在防火牆規則上，指定為第一個被允許的規則，請問要如何使用ufw設定？", options: ["A. ufw replace 1 allow 80/tcp", "B. ufw insert 1 allow 80/tcp", "C. ufw rules 1 allow 80/tcp", "D. ufw allow 80/tcp rule 1"], ans: ["B"], exp: "" },
    { id: 21, type: "multiple", q: "關於IMAP的敘述，下列哪些正確？", options: ["A. 主要用於離線模式", "B. 適用於多於一台電腦使用", "C. 收信時不需把信件全文下載至電腦", "D. 可以於郵件伺服器上建立資料目錄存郵件"], ans: ["B", "C", "D"], exp: "" },
    { id: 22, type: "single", q: "如附圖所示，小明查看/etc/netplan目錄內的網路組態設定檔案（*.yaml），他發現該目錄存在著許多YAML檔案，請問下列敘述哪一項正確？", options: ["A. 可以有多個組態檔案、通常以數字起頭，而netplan會依照字母順序、由小而大、逐一套用所有的YAML組態", "B. 可以有多個組態檔案、通常以數字起頭，而netplan會依照字母順序來套用最後一個YAML組態設定檔案，而", "C. netplan組態檔案只能定義一個（副檔名為yaml），若定義超過一個以上的組態設定檔案，套用時netplan會出", "D. 可以有多個組態檔案、通常以數字起頭，而netplan會依照字母順序來套用第一個YAML組態設定檔案，而忽"], ans: ["A"], exp: "" },
    { id: 23, type: "single", q: "小花是公司的Ubuntu Linux系統管理員，她現在想要啟動已安裝完成的SELinux安全功能，請問她應該要執行下列哪一個指令？", options: ["A. selinux start ; reboot", "B. selinux enabled", "C. selinux-activate ; reboot", "D. selinux ; reboot"], ans: ["C"], exp: "剛安裝完成的SELinux安全功能，在設定好啟動功能之後，需要重新開機，才能完全啟動。" },
    { id: 24, type: "single", q: "請問下列哪一個使用者帳號是當Apache讀取網站裡的網頁檔案或存放這些檔案的目錄時，會使用的使用者帳號？", options: ["A. www-data", "B. apache", "C. httpd", "D. root"], ans: ["A"], exp: "" },
    { id: 25, type: "single", q: "為了增加Mail Server的安全性，哪一項建議可以防止不必要的嘗試連線和攻擊？", options: ["A. 使用防火牆來限制未經授權的連線", "B. 使用弱密碼，以便用戶可以輕鬆記住", "C. 允許所有用戶訪問伺服器的管理界面", "D. 允許任何IP地址連線"], ans: ["A"], exp: "" },
    { id: 26, type: "single", q: "Nginx網頁伺服器啟動後，正常情況下會開啟下列哪一項埠號提供無加密的網頁流量？", options: ["A. 110", "B. 53", "C. 80", "D. 25"], ans: ["C"], exp: "(A)TCP port 25是SMTP在使用。(B)UDP port 53是DNS查詢在使用，TCP port 53是DNS用來進行zone transfer。(D)TCP port 110是POP3在使用。" },
    { id: 27, type: "single", q: "下列哪一種接頭是應用於1000Base-T（Gigabit Ethernet）網路？", options: ["A. 終端電阻", "B. T型接頭", "C. RJ-45", "D. BNC"], ans: ["C"], exp: "" },
    { id: 28, type: "single", q: "Sendmail大量運用m4這個程式來編譯Sendmail的組態檔案，下列哪一項是m4的主要功能？", options: ["A. m4是一個Macro Processor", "B. m4是一個C Compiler", "C. m4是一個Shell", "D. m4是一個Text Editor"], ans: ["A"], exp: "" },
    { id: 29, type: "single", q: "下列哪一項設定可以讓Nginx使用TLS 1.3來保護網頁流量？", options: ["A. ssl_protocol TLSv1.3; #使用TLS 1.3", "B. ssl_protocols TLSv1.3; #使用TLS 1.3", "C. tls_protocols TLSv1.3; #使用TLS 1.3", "D. tls_protocol TLSv1.3; #使用TLS 1.3"], ans: ["B"], exp: "(B)(C)(D)皆語法錯誤。" },
    { id: 30, type: "multiple", q: "下列哪些資訊會在Sendmail佇列中呈現？", options: ["A. 到達時間（Arrival Time）", "B. 收信者（Recipients）", "C. 送信者（Sender）", "D. 郵件大小（Message Size）"], ans: ["A", "B", "C", "D"], exp: "" },
    { id: 31, type: "single", q: "IPv6的全域位址如同IPv4的Public IP，關於IPv6全域位址的敘述下列哪一項正確？", options: ["A. 前四個位元固定為0011", "B. 前四個位元固定為1100", "C. 前三個位元固定為001", "D. 前三個位元固定為100"], ans: ["C"], exp: "" },
    { id: 32, type: "single", q: "下列哪一項設定可以將https所需之憑證對應的私密金鑰（/etc/ssl/private/apache-selfsigned.key）指定給Apache的虛擬主機？", options: ["A. SSLCertKeyFile /etc/ssl/private/apache-selfsigned.key", "B. SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key", "C. SSLCertKey /etc/ssl/private/apache-selfsigned.key", "D. SSLCertificateKey /etc/ssl/private/apache-selfsigned.key"], ans: ["B"], exp: "" },
    { id: 33, type: "single", q: "下列哪一項為DHCP伺服器及用戶端預設使用的埠號，server port/client port？", options: ["A. 53/68", "B. 68/67", "C. 67/68", "D. 67/53"], ans: ["C"], exp: "" },
    { id: 34, type: "single", q: "小明想要替公司的Ubuntu Linux Server架設LDAP服務，請問他需要安裝下列哪一個套件以達成目標？", options: ["A. ldapd", "B. Account", "C. slapd", "D. openLDAP"], ans: ["C"], exp: "" },
    { id: 35, type: "single", q: "Telnet伺服器（Server）啟動後，通常會綁定下列哪一個號碼作為Client的連接埠號？", options: ["A. 23", "B. 20", "C. 21", "D. 22"], ans: ["A"], exp: "" },
    { id: 36, type: "single", q: "關於UDP及TCP的敘述，下列哪一項錯誤？", options: ["A. UDP可靠性低於TCP", "B. UDP傳輸效率高於TCP", "C. UDP/TCP傳送資料前都會經過連線交握（handshaking）的動作", "D. UDP/TCP封包都有來源埠號及目的埠號"], ans: ["C"], exp: "UDP不會有連線交握的情況，但TCP為了確保對方能夠正確收到封包，會進行連線交握。" },
    { id: 37, type: "multiple", q: "iptables的NAT（Network Address Translation）表格主要是用於處理來源地址、目標地址或Port Number的轉換。請問在NAT表格當中，包含哪些規則鏈（Chain）？", options: ["A. OUTPUT", "B. POSTROUTING", "C. PREROUTING", "D. INPUT"], ans: ["A", "B", "C"], exp: "" },
    { id: 38, type: "single", q: "下列哪一個檔案是用來定義Linux常用的連接埠號（Port Number）、連線方式（tcp/udp）與服務程式的對應關係？", options: ["A. /etc/xinetd.conf", "B. /etc/services", "C. /etc/hosts", "D. /etc/hosts.allow"], ans: ["B"], exp: "(A)是正解。(B)是xinetd組態設定檔案。(C)定義主機名稱與IP Address的對應關係。(D)是TCP Wrapper重要檔案之一。" },
    { id: 39, type: "single", q: "小花現在正在替公司的Ubuntu Linux進行SELinux安全模組設定。她應該利用下列哪一個指令查看SELinux所有的布林值？", options: ["A. getseboolen -a", "B. getsebool -a", "C. getsebool --list-all", "D. getseboolen --list-all"], ans: ["B"], exp: "" },
    { id: 40, type: "single", q: "POP3和IMAP屬於下列哪一類型的電子郵件服務？", options: ["A. 郵件用戶代理（MUA）", "B. 郵件傳輸代理（MTA）", "C. 郵件投遞代理（MDA）", "D. 郵件接收代理（MRA）"], ans: ["D"], exp: "" },
    { id: 41, type: "single", q: "如附圖所示，為Apache提供的一種基本的（Basic）使用者名稱和密碼認證功能，當網頁瀏覽器要瀏覽某目錄下的資源時，會出現一個對話視窗詢問使用者帳號和密碼，需輸入正確方可開始瀏覽該目錄下的資源。網頁伺服器端需要為受保護的目錄建立合法的使用者帳號和密碼，請問下列哪一項指令可以用來建立？", options: ["A. passwd", "B. htpasswd", "C. crypt", "D. auth"], ans: ["B"], exp: "" },
    { id: 42, type: "single", q: "下列哪一個named的選項可以設定named的程序擁有者？", options: ["A. -U", "B. -u", "C. -l", "D. –L"], ans: ["B"], exp: "" },
    { id: 43, type: "single", q: "小揚的公司內部有一Linux防火牆，分別連接192.168.0.0/24以及172.16.1.0/24兩個網段以及連至DMZ的網路。小揚需要允許192.168.0.0/24網段的電腦連線至DMZ上的Samba Server，請問他該如何使用ufw指令調整防火牆？", options: ["A. ufw allow from 192.168.0.0/24 to any app Samba", "B. ufw allow from 172.16.1.0/24", "C. ufw allow from 192.168.0.0/24 to DMZ", "D. ufw allow app Samba to 192.168.0.0/24"], ans: ["A"], exp: "ufw指令可配合app與from兩項輔助選項，指定可連線通過的網段，連至網路上的應用程式伺服器。" },
    { id: 44, type: "single", q: "在Sendmail系統中，欲將寄給admin的信件轉給webadm這個帳號，在別名檔應使用下列哪一項設定？", options: ["A. admin: webadm", "B. root: webadm", "C. webadm: admin", "D. admin: root"], ans: ["A"], exp: "" },
    { id: 45, type: "multiple", q: "關於SSH伺服器的敘述，下列哪一項錯誤？", options: ["A. 使用SSH連線遠端主機時如果未指定帳號，系統將以本地端目前的使用者帳號來嘗試登入遠端機器", "B. 在用戶端使用者的家目錄下的~/.ssh/known_hosts會記錄曾經連線過的主機的public key", "C. 在/etc/nologin檔案中可設定SSH不可登入的使用者清單", "D. Ubuntu 22.04的root帳號是無法利用SSH登入遠端系統"], ans: ["C", "D"], exp: "" },
    { id: 46, type: "single", q: "下列哪一項指令可以離開nslookup交談模式？", options: ["A. exit", "B. quit", "C. bye", "D. return"], ans: ["A"], exp: "在Linux作業系統，如：Ubuntu 22.04或Rocky Linux 9.2，只有指令exit可以離開nslookup交談模式。但如果是在Windows作業系統，指令exit和指令quit都可以離開nslookup交談模式。" },
    { id: 47, type: "single", q: "小明在公司內負責Ubuntu Linux Server的安全工作。請問他所考慮進行防護的工作，下列哪一項錯誤？", options: ["A. 以TCP/IP堆疊進行考慮與佈署防護機制", "B. 建請公司採購相當數量的滅火器，放置於機櫃內", "C. 從資安三要素CIA考慮Server上的服務安全設定鬆緊程度", "D. 考慮網路威脅程度，建置足夠的防禦縱深機制"], ans: ["B"], exp: "" },
    { id: 48, type: "single", q: "請問TCP 22埠號為下列哪一個Daemon所使用？", options: ["A. Telnet Server", "B. SSH Server", "C. FTP Server", "D. SMTP Server"], ans: ["B"], exp: "" },
    { id: 49, type: "single", q: "執行route指令查看路由表時，Default Gateway的Flags為UG，請問代表下列哪一項意思？", options: ["A. 使用動態路由，恢復路由資訊的旗標", "B. 這個路由將不會被接受", "C. 停止該筆紀錄預設路由的功能", "D. 標示路由已啟動且需要透過Gateway轉遞封包"], ans: ["D"], exp: "U表示該條route啟用中(UP)，G表示作用中的Gateway；故(D)是正解。" },
    { id: 50, type: "multiple", q: "若想解決Sendmail的過度開放Relay問題，下列哪些方式是可行的？", options: ["A. 只開放Relay功能給127.0.0.1", "B. 委派專人幫公司所有人寄信", "C. 只開放給內部網路，只有在該網路中才可使用SMTP寄信", "D. 搭配使用SASL，要通過認證後才能寄信"], ans: ["C", "D"], exp: "" },
    { id: 51, type: "single", q: "下列哪一項是SSH替代Telnet的最主要原因？", options: ["A. SSH使用了加密技術，因此通訊速度較快", "B. SSH比較不會對伺服器造成額外的負擔", "C. Telnet傳輸資訊時所有資料都是明文，有安全疑慮", "D. Telnet的使用者認證需要花不少時間，必須改進"], ans: ["C"], exp: "" },
    { id: 52, type: "single", q: "在Nginx中，若有一網站因故要改使用新的域名www.domain2.com，考量到可能有些使用者的網頁瀏覽器書籤儲存著舊的域名，或是其他網站有些網頁的超連結指向舊的域名，因此管理員不打算直接廢棄舊域名，而是將收到的指向舊域名之網頁請求「永久」導向新的域名www.domain2.com下同樣名稱的資源。請問下列哪一項設定可以完成上述要求？", options: ["A. rewrite ^/(.*)1 permanently;", "B. rewrite ^/$ http://www.domain2.com permanent;", "C. rewrite ^/$ http://www.domain2.com permanently;", "D. rewrite ^/(.*)1 permanent;"], ans: ["D"], exp: "" },
    { id: 53, type: "single", q: "Apache網頁伺服器啟動後，正常情況下會開啟下列哪一項埠號提供無加密的網頁流量？", options: ["A. 53", "B. 25", "C. 80", "D. 110"], ans: ["C"], exp: "" },
    { id: 54, type: "single", q: "一般在Ubuntu Linux Server上架設VPN服務時，都是安裝OpenVPN套件。請問該套件是使用哪一種VPN堆疊加密方式？", options: ["A. CHAP", "B. SSL/TLS", "C. PPTP", "D. IPSec"], ans: ["B"], exp: "" },
    { id: 55, type: "single", q: "小花利用公司的Ubuntu Linux Server架設VPN服務，她寫好設定檔server1.conf之後，放置於/etc/openvpn目錄之下。請問她該如何啟動VPN服務？", options: ["A. openvpn connect", "B. systemctl start openvpn@server1", "C. systemctl start openvpn", "D. openvpn start connect"], ans: ["B"], exp: "" },
    { id: 56, type: "single", q: "下列哪一項是每個DNS正/反解區域檔中只能出現一次的資源紀錄？", options: ["A. NS", "B. MX", "C. SOA", "D. CNAME"], ans: ["C"], exp: "Start Of Authority，這種資源紀錄放在區域檔一開始的地方，每一個區域檔只能有一個 SOA，而且SOA一定是檔案中第一個資源紀錄。" },
    { id: 57, type: "single", q: "FDDI是藉由光的傳遞，不能讓進出的光彼此干擾，採用下列哪一種網路結構？", options: ["A. 環狀拓樸（Ring Topology）", "B. 星狀拓樸（Star Topology）", "C. 混合式拓樸（Hybird Topology）", "D. 匯流排拓樸（Bus Topology）"], ans: ["A"], exp: "" },
    { id: 58, type: "single", q: "在Ubuntu Linux Server上架設VPN服務，通常會安裝openvpn以及easy-rsa兩套軟體。請問下列哪一項不是使用easy-rsa軟體的目的？", options: ["A. 製作授權驗證機制，進行Server與Client的電子簽章", "B. 利用產生的key進行登入的身份驗證", "C. 產生兩把key來協助VPN通訊內容的加解密", "D. 利用key來啟動VPN服務"], ans: ["D"], exp: "easy-key可以產生RSA公私金鑰對以及CA電子簽章憑證的金鑰。" },
    { id: 59, type: "single", q: "編輯Mail Relay檔內容，下列哪一項正確？", options: ["A. 61.62.63.64 Relay", "B. Relay 61.62.63.64", "C. RELAY 61.62.63.64", "D. 61.62.63.64 RELAY"], ans: ["D"], exp: "" },
    { id: 60, type: "single", q: "下列哪一項指令可以清除目前路由表的快取資訊？", options: ["A. route --clean", "B. route --flush", "C. ip route flush cache", "D. route --no-cache"], ans: ["C"], exp: "" },
    { id: 61, type: "single", q: "TXT資源紀錄的值可以用來描述寄件者原則架構（Sender Policy Framework, SPF）紀錄，幫助收信網域判斷來信是否為假冒合法網域的垃圾郵件。若SPF TXT紀錄內容最後方的限定詞是~all，且電子郵件的來源IP位址沒有列在SPF紀錄中時，下列敘述哪一項正確？", options: ["A. 郵件可被正常接受", "B. 中立，由接收郵件的伺服器自行決定如何處理所收到的郵件", "C. 郵件可被接受但應標記為垃圾郵件", "D. 郵件應拒收"], ans: ["C"], exp: "" },
    { id: 62, type: "single", q: "下列哪一個設定檔是BIND（Berkeley Internet Name Domain）的工作環境設定檔？", options: ["A. named.conf", "B. localhost.zone", "C. named.ca", "D. named.local"], ans: ["A"], exp: "" },
    { id: 63, type: "single", q: "SRV紀錄可為特定的服務（如LDAP等）指定伺服器和連接埠，若一網域內有兩台伺服器AD1和AD2皆提供LDAP服務，且AD1的SRV紀錄裡優先順序值為1、權重值為3，AD2的SRV紀錄裡優先順序為2、權重值為1。若兩台伺服器皆正常運行，關於兩台伺服器服務的連線數量，下列敘述哪一項正確？", options: ["A. AD1服務的連線數量是AD2的一半", "B. 全部都是AD1在服務", "C. AD1服務的連線數量是AD2的3倍", "D. 全部都是AD2在服務"], ans: ["B"], exp: "" },
    { id: 64, type: "single", q: "下列哪一項是Samba伺服器的分享設定檔？", options: ["A. /etc/smb/smb.conf", "B. /etc/smb/samba.conf", "C. /etc/samba/samba.conf", "D. /etc/samba/smb.conf"], ans: ["D"], exp: "(A)(B)(C)無此檔案。" },
    { id: 65, type: "single", q: "下列哪一項是屬於封閉迴路，自我測試使用的IP位址？", options: ["A. 127.0.0.1", "B. 172.16.0.255", "C. 10.10.0.1", "D. 192.168.0.0"], ans: ["A"], exp: "" },
    { id: 66, type: "single", q: "在DHCP伺服器預設組態設定檔中，設定名稱伺服器為tq3，要使用下列哪一個宣告？", options: ["A. option domain-name-servers tq3;", "B. option domain-name tq3;", "C. option routers tq3;", "D. option dhcp-server tq3;"], ans: ["A"], exp: "" },
    { id: 67, type: "single", q: "如附圖所示，小明在Ubuntu維護紀錄手冊中查到前一任網管所紀錄的NAT設定指令，試問該設定具有下列哪一項的意義？", options: ["A. 凡是經過120.110.100.101的封包均轉至192.168.1.0/24網段", "B. 將192.168.1.0/24這個網段出去所有封包的來源網址轉換為120.110.100.101", "C. 將192.168.1.0/24這個網段的封包均轉向至120.110.100.101", "D. 將192.168.1.0/24這個網段的預設路由設為120.110.100.101"], ans: ["B"], exp: "該指令主要目的是由enp0s3網卡往外傳送（POSTROUTING）的封包進行NAT的來源網址轉換（SNAT）：來自192.168.1.0/24網路封包的來源網更改為120.110.100.101。SNAT通常是在「對外網路為靜態IP Address」的情況下使用，可用於將內部網路的私有IP Address轉換為合法對外的IP Address，以便將封包往Internet傳送。" },
    { id: 68, type: "single", q: "當用戶端設備要連接網路時，它會發送出請求封包，而網路上的某一種伺服器會分配可用的IP位址和其他配置資訊，並將這些網路資訊一起發送回客戶端，使其能夠正確地配置網路參數。請問上面所說的是下列哪一種網路服務？", options: ["A. SSH", "B. RCP", "C. DHCP", "D. DNS"], ans: ["C"], exp: "" },
    { id: 69, type: "single", q: "負責管理特定頂級域（如 .com或 .org）下所有域名的機構或公司，稱為下列哪一項？", options: ["A. 網域註冊機構", "B. DNS伺服器", "C. 域名註冊商", "D. 網域代理人"], ans: ["A"], exp: "" },
    { id: 70, type: "single", q: "下列哪一個IP是屬於Class C範圍的IP？", options: ["A. 192.168.122.1", "B. 127.0.0.1", "C. 230.95.1.11", "D. 168.117.10.68"], ans: ["A"], exp: "" },
    { id: 71, type: "single", q: "mail logs位在下列哪一個目錄底下？", options: ["A. /var/log", "B. /log", "C. /var/adm/syslogs", "D. /logs"], ans: ["A"], exp: "" },
    { id: 72, type: "single", q: "下列哪一個資料夾用於當作Sendmail的佇列存放mail的相關資料？", options: ["A. /var/spool/mail", "B. /var/spool/mailq", "C. /var/spool/sendmail", "D. /var/spool/mqueue"], ans: ["D"], exp: "" },
    { id: 73, type: "single", q: "下列哪一個檔案為NFS伺服器分享目錄的設定檔？", options: ["A. /proc/filesystem", "B. /etc/export", "C. /usr/share/nfs", "D. /etc/exports"], ans: ["D"], exp: "" },
    { id: 74, type: "single", q: "下列哪一個郵件協定允許使用者在伺服器上管理郵件，而不需要完全下載？", options: ["A. POP3", "B. IMAP", "C. SMTP", "D. SNMP"], ans: ["B"], exp: "" },
    { id: 75, type: "single", q: "在某區域網路中所有電腦都連接到一台交換器（switch），這是下列哪一種網路結構？", options: ["A. 匯流排拓樸（Bus Topology）", "B. 星狀拓樸（Star Topology）", "C. 混合式拓樸（Hybird Topology）", "D. 環狀拓樸（Ring Topology）"], ans: ["B"], exp: "" },
    { id: 76, type: "single", q: "小明接受到指令，要求在Ubuntu Linux Server上建立一個網頁用目錄/helloworld來放置公司的網站。請問他應該要指定這個目錄的SELinux脈胳規則（Context）為下列哪一種類型屬性？", options: ["A. httpd_sys_rw_content_t", "B. httpd_sys_ro_content_t", "C. httpd_sys_content_t", "D. httpd_content_t"], ans: ["C"], exp: "" },
    { id: 77, type: "single", q: "小花接到MIS部門的求救電話，MIS表示他們將網站的連線埠改至8191埠，防火牆也配合設定更改埠號，但無法啟動服務，原因是8191埠出現「Permission Denied」字樣。請問，小花可用下列哪一個指令進行處理？", options: ["A. semanage boolean -a http_port_t 8191", "B. semanage port -a -t http_port_t -p tcp 8191", "C. semanage fcontext -a -t http_sys_port_t -p 8191", "D. semanage port -a http_sys_port_t -p 8191"], ans: ["B"], exp: "httpd服務通訊埠需要使用http_port_t類型的SELinux屬性值。" },
    { id: 78, type: "single", q: "小花現在正在設定Ubuntu Linux上的網頁檔案，但該檔案只是暫時放置的檔案，小花可以利用下列哪一個指令，進行臨時的SELinux檔案的脈絡規則設定？", options: ["A. audit2allow", "B. semanage fcontext", "C. restorecon", "D. chcon"], ans: ["D"], exp: "使用chcon可臨時修改SELinux的檔案脈絡規則屬性。" },
    { id: 79, type: "single", q: "如附圖所示，成功登入Samba伺服器分享目錄，出現如附圖命令列，請問下列哪一項不是登入後可以使用的指令？", options: ["A. get", "B. cp", "C. ?", "D. mget"], ans: ["B"], exp: "" },
    { id: 80, type: "multiple", q: "小明是公司的Ubuntu Linux管理員。他現在想要在Ubuntu Linux上安裝SELinux以強化系統安全，請問他可以安裝下列哪些套件？", options: ["A. policycoreutils", "B. selinux", "C. selinux-basics", "D. selinux-utils"], ans: ["A", "C", "D"], exp: "" },
    { id: 81, type: "multiple", q: "在Squid設定檔內，如果允許內部網路10.0.0.0/8網段使用HTTP代理服務，請問下列哪些設定項目正確？(複選題)", options: ["A. acl my_localnet src 10.0.0.0/8", "B. http_access allow localnet", "C. http_access allow my_localnet", "D. acl localnet dst 10.0.0.0/8"], ans: ["A", "C"], exp: "" },
    { id: 82, type: "single", q: "可使用下列哪一個指令來測試DNS伺服器？", options: ["A. bind", "B. ping", "C. nslookup", "D. dns"], ans: ["C"], exp: "" },
    { id: 83, type: "single", q: "指令nslookup所詢問的名稱伺服器若無回應，nslookup預設會詢問3次，每次等待5秒，因此總共花費15秒後放棄。如果希望它的行為變成詢問2次，每次等待1秒，總共花費2秒後放棄，請問下列哪一個指令可以正確達到此要求（假設要查詢example.com的IP位址）？", options: ["A. nslookup -retry=1 -timeout=1 example.com", "B. nslookup -retry=2 -timeout=1 example.com", "C. nslookup -r=1 -t=1 example.com", "D. nslookup -r=2 -t=1 example.com"], ans: ["B"], exp: "符合此要求的option是retry和timeout。不過，雖然retry的中文是「再」嘗試，給人一種已經試過一次現在要再試一次的感覺，但這裡實際上retry是要試幾次的意思。然而當-retry=0時，nslookup確實有嘗試一次詢問，而非完全不試。" },
    { id: 84, type: "single", q: "NFS伺服器的用途為下列哪一項？", options: ["A. 檔案分享給Linux用戶", "B. Linux的時間伺服器", "C. 檔案分享給Windows用戶", "D. 動態分配IP的伺服器"], ans: ["A"], exp: "" },
    { id: 85, type: "single", q: "如果Linux系統/etc/passwd中沒有lin帳號，而要新增名為lin的Samba帳號，下列敘述哪一項正確？", options: ["A. 新增成功，但無法登入Samba伺服器", "B. 新增成功，但無法設定帳號密碼", "C. Samba的帳號與Linux系統帳號無關，可以新增", "D. 新增命令回應無法新增"], ans: ["D"], exp: "" },

// 初始化畫面載入題目
function loadQuiz() {
    const form = document.getElementById('quiz-form');
    let html = '';
    quizData.forEach((item, index) => {
        const inputType = item.type === 'multiple' ? 'checkbox' : 'radio';
        let optionsHtml = '';
        item.options.forEach(opt => {
            const optLetter = opt.charAt(0);
            optionsHtml += `
                <label>
                    <input type="${inputType}" name="q${item.id}" value="${optLetter}">
                    ${opt}
                </label>
            `;
        });

        html += `
            <div class="question" id="q-box-${item.id}">
                <div class="question-title">${item.id}. ${item.q} (${item.type === 'multiple' ? '複選題' : '單選題'})</div>
                <div class="options">${optionsHtml}</div>
                <div id="result-${item.id}"></div>
            </div>
        `;
    });
    form.innerHTML = html;
}

// 切換頁籤
function switchTab(tabName) {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

    if (tabName === 'quiz') {
        document.querySelector('.nav-tabs button:nth-child(1)').classList.add('active');
        document.getElementById('quiz-section').classList.add('active');
    } else {
        document.querySelector('.nav-tabs button:nth-child(2)').classList.add('active');
        document.getElementById('history-section').classList.add('active');
        renderHistory();
    }
}

// 提交測驗與批改
function submitQuiz() {
    let score = 0;
    let totalQuestions = quizData.length;

    quizData.forEach(item => {
        const qBox = document.getElementById(`q-box-${item.id}`);
        const resultDiv = document.getElementById(`result-${item.id}`);
        const inputs = document.querySelectorAll(`input[name="q${item.id}"]:checked`);
        
        let userAns = Array.from(inputs).map(input => input.value).sort();
        let correctAns = [...item.ans].sort();

        // 判斷對錯
        let isCorrect = (userAns.length === correctAns.length) && userAns.every((val, index) => val === correctAns[index]);

        qBox.className = "question " + (isCorrect ? "correct" : "incorrect");

        if (isCorrect) {
            score += 0.3; // 每題 0.3 分
            resultDiv.innerHTML = `<div class="feedback correct-msg">回答正確！</div>`;
        } else {
            let expText = item.exp ? `<br>答案解釋：${item.exp}` : '';
            resultDiv.innerHTML = `
                <div class="feedback incorrect-msg">
                    回答錯誤！您的作答：${userAns.join(' ') || '未作答'}<br>
                    <strong>正確答案：${correctAns.join(' ')}</strong>
                    ${expText}
                </div>
            `;
        }
    });

    // 顯示總分面板（總分計到小數點後一位，滿分30分）
    const finalScore = (score).toFixed(1);
    const scorePanel = document.getElementById('score-panel');
    scorePanel.style.display = 'block';
    scorePanel.innerHTML = `測驗完成！您的得分：${finalScore} 分 (滿分 30.0 分)`;

    // 儲存至歷史紀錄
    saveHistory(finalScore);

    // 滾動到最上方看成績
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 儲存歷史紀錄至 localStorage
function saveHistory(score) {
    let history = JSON.parse(localStorage.getItem('quiz_history')) || [];
    const now = new Date();
    const timeStr = now.toLocaleString();
    history.unshift({ time: timeStr, score: score });
    localStorage.setItem('quiz_history', JSON.stringify(history));
}

// 渲染歷史紀錄
function renderHistory() {
    const historyContent = document.getElementById('history-content');
    let history = JSON.parse(localStorage.getItem('quiz_history')) || [];

    if (history.length === 0) {
        historyContent.innerHTML = '<p style="text-align:center; color:#777;">目前尚無測驗紀錄。</p>';
        return;
    }

    let html = `
        <table class="history-table">
            <thead>
                <tr>
                    <th>項次</th>
                    <th>交卷時間</th>
                    <th>得分</th>
                </tr>
            </thead>
            <tbody>
    `;

    history.forEach((record, index) => {
        html += `
            <tr>
                <td>${index + 1}</td>
                <td>${record.time}</td>
                <td>${record.score} / 30.0 分</td>
            </tr>
        `;
    });

    html += `</tbody></table>`;
    historyContent.innerHTML = html;
}

// 清除歷史紀錄
function clearHistory() {
    if (confirm('確定要清除所有歷史紀錄嗎？')) {
        localStorage.removeItem('quiz_history');
        renderHistory();
    }
}

// 初始化執行
window.onload = loadQuiz;
</script>
